<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Locator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#f4f5f8; --surface:rgba(255,255,255,.78); --surface-solid:#ffffff; --raised:rgba(15,20,25,.045);
  --text:#0e1217; --muted:#6a7380; --line:rgba(15,20,25,.09);
  --accent:#2f6bff; --accent-soft:rgba(47,107,255,.12); --accent-text:#ffffff;
  --ok:#1faa59; --warn:#d98a0b; --danger:#e0463d; --prop:#ff3b30; --opp:#ff9f0a;
  --shadow:0 10px 40px -10px rgba(20,30,50,.28), 0 2px 8px rgba(20,30,50,.08);
  --sans:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --card-h:0px;
}
:root[data-theme="dark"]{
  --bg:#0b0d11; --surface:rgba(22,25,31,.74); --surface-solid:#171a21; --raised:rgba(255,255,255,.055);
  --text:#eef1f6; --muted:#8a93a2; --line:rgba(255,255,255,.08);
  --accent:#5b8cff; --accent-soft:rgba(91,140,255,.16); --accent-text:#0b0d11;
  --shadow:0 14px 44px -10px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;transition:background .4s var(--ease),color .4s var(--ease)}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}

#map{position:fixed;inset:0;animation:fadeIn .8s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* glass */
.glass{background:var(--surface);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--shadow);transition:background .4s var(--ease),border-color .4s var(--ease)}

/* top bar */
.title{position:fixed;top:16px;left:16px;z-index:10;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:999px;animation:dropIn .7s var(--ease) both}
.title .logo{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:background .4s}
.title .logo svg{width:13px;height:13px;stroke:var(--accent-text);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.title b{font-weight:600;letter-spacing:-.01em}
.gps-state{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding-left:10px;margin-left:2px;border-left:1px solid var(--line)}
.gps-state i{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .3s,box-shadow .3s}
.gps-state.on i{background:var(--ok);box-shadow:0 0 0 0 rgba(31,170,89,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(31,170,89,0)}100%{box-shadow:0 0 0 0 rgba(31,170,89,0)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

.gear{position:fixed;top:16px;right:16px;z-index:12;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;animation:dropIn .7s var(--ease) .1s both;transition:transform .35s var(--ease)}
.gear svg{width:19px;height:19px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .6s var(--ease)}
.gear:hover svg,.gear.open svg{transform:rotate(90deg)}
.gear:active{transform:scale(.92)}

/* settings */
.scrim{position:fixed;inset:0;z-index:11;display:none}
.scrim.open{display:block}
.settings{position:fixed;top:68px;right:16px;z-index:13;width:290px;border-radius:20px;padding:18px;opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;pointer-events:none;transition:opacity .25s var(--ease),transform .35s var(--ease)}
.settings.open{opacity:1;transform:none;pointer-events:auto}
.settings h3{font-size:13px;font-weight:600;margin-bottom:14px;letter-spacing:-.01em}
.setting{margin-bottom:14px}
.setting:last-of-type{margin-bottom:6px}
.setting label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:7px}
.setting label em{font-style:normal;color:var(--text);opacity:.7}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--raised);border-radius:11px;padding:3px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:9px;background:var(--surface-solid);box-shadow:0 1px 4px rgba(0,0,0,.18);transform:translateX(calc(var(--i,0)*100%));transition:transform .4s var(--ease),background .4s}
.seg button{position:relative;z-index:1;padding:7px 0;font-size:12.5px;font-weight:500;color:var(--muted);border-radius:9px;transition:color .25s}
.seg button.active{color:var(--text)}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}

/* card */
.card{position:fixed;z-index:10;left:16px;bottom:16px;width:352px;border-radius:24px;padding:18px;animation:riseIn .8s var(--ease) .15s both}
@keyframes riseIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.label{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted);transition:all .3s}
.chip.live{background:var(--accent-soft);color:var(--accent)}
.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.coord{background:var(--raised);border-radius:14px;padding:10px 12px}
.coord small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-bottom:3px;letter-spacing:.04em}
.coord span{font-family:var(--mono);font-size:14px;font-weight:500;display:block;white-space:nowrap}
.coord span.empty{color:var(--muted);font-size:13px}
.tick{animation:tick .45s var(--ease)}
@keyframes tick{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}

.addr{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--raised);margin-bottom:8px;overflow:hidden}
.addr::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:transparent;transition:background .4s}
.addr.live::before{background:var(--prop)}
.addr.opp.live::before{background:var(--opp)}
.addr-body small::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--prop);vertical-align:1px}
.addr.opp .addr-body small::before{background:var(--opp)}
.addr-body{flex:1;min-width:0}
.addr-body small{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.addr-body p{font-size:14px;font-weight:500;line-height:1.35;letter-spacing:-.005em}
.addr-body p.empty{color:var(--muted);font-weight:400;font-size:13px}
.addr-body p.loading{height:12px;width:70%;border-radius:6px;margin:5px 0 3px;background:linear-gradient(90deg,var(--raised) 25%,var(--line) 50%,var(--raised) 75%);background-size:200% 100%;animation:shimmer 1.1s linear infinite;color:transparent;overflow:hidden}
@keyframes shimmer{to{background-position:-200% 0}}
.copy{flex-shrink:0;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);opacity:0;transform:scale(.8);pointer-events:none;transition:all .3s var(--ease)}
.copy svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.addr.live .copy{opacity:1;transform:none;pointer-events:auto}
.copy:hover{background:var(--accent-soft);color:var(--accent)}
.copy.done{color:var(--ok);background:rgba(31,170,89,.12)}

.btn-primary{position:relative;overflow:hidden;width:100%;padding:14px;border-radius:15px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;transition:transform .25s var(--ease),filter .2s,background .4s}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{transform:scale(.975)}
.btn-primary svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.btn-primary .spin{display:none;width:17px;height:17px;border:2.4px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
.btn-primary.loading svg{display:none}
.btn-primary.loading .spin{display:block}
.btn-primary.loading{pointer-events:none;filter:saturate(.7)}
@keyframes rot{to{transform:rotate(360deg)}}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn-sec{padding:11px;border-radius:13px;background:var(--raised);font-weight:500;font-size:13px;color:var(--text);transition:transform .25s var(--ease),background .2s}
.btn-sec:hover{background:var(--accent-soft)}
.btn-sec:active{transform:scale(.96)}

.help{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(224,70,61,.1);color:var(--danger);font-size:12px;line-height:1.5;animation:tick .4s var(--ease)}
.help.show{display:block}
.help b{font-weight:600}
.help.info{background:var(--accent-soft);color:var(--accent)}

/* toast */
.toast{position:fixed;top:68px;left:50%;z-index:30;transform:translate(-50%,-14px) scale(.96);opacity:0;pointer-events:none;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;transition:all .4s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* markers */
.pin{width:36px;height:46px;cursor:grab;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:pinDrop .65s var(--ease) both;transform-origin:50% 100%}
.pin:active{cursor:grabbing}
.pin svg{width:100%;height:100%}
.pin .p-fill{fill:var(--prop)}
@keyframes pinDrop{0%{transform:translateY(-40px) scale(.7);opacity:0}55%{transform:translateY(0) scale(1.08,.92);opacity:1}75%{transform:translateY(-6px) scale(.98,1.03)}100%{transform:none}}
.dot{position:relative;width:20px;height:20px;pointer-events:none}
.dot::before{content:'';position:absolute;inset:-12px;border-radius:50%;background:rgba(66,133,244,.28);animation:pulse 2.4s ease-out infinite}
.dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.7);opacity:0}}

/* maplibre chrome */
.maplibregl-ctrl-top-right{top:68px;right:6px}
.maplibregl-ctrl-group{background:var(--surface)!important;backdrop-filter:blur(20px);border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:var(--shadow)!important;overflow:hidden}
.maplibregl-ctrl-group button{background:transparent!important;width:38px;height:38px}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:none}
:root[data-theme="dark"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-attrib{background:var(--surface)!important;color:var(--muted)!important;border-radius:10px!important;font-size:10px!important}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-bottom-right{transition:bottom .4s var(--ease)}

@media(max-width:640px){
  .card{left:10px;right:10px;bottom:10px;width:auto;padding:16px;border-radius:22px}
  .maplibregl-ctrl-bottom-right{bottom:var(--card-h)}
  .gps-state span{display:none}
  .settings{right:10px;left:10px;width:auto}
  .title{left:10px;top:12px}.gear{right:10px;top:12px}
  .maplibregl-ctrl-top-right{top:62px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="map"></div>

<div class="title glass">
  <div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></div>
  <b>Locator</b>
  <div class="gps-state" id="gpsState"><i></i><span id="gpsLabel">No fix</span></div>
</div>

<button class="gear glass" id="gear" aria-label="Settings">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
</button>

<div class="scrim" id="scrim"></div>
<div class="settings glass" id="settings">
  <h3>Appearance</h3>
  <div class="setting">
    <label>Website style <em id="siteNote"></em></label>
    <div class="seg" data-key="site">
      <span class="thumb"></span>
      <button data-v="system">Device</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
    </div>
  </div>
  <div class="setting">
    <label>Map style <em id="mapNote"></em></label>
    <div class="seg" data-key="map">
      <span class="thumb"></span>
      <button data-v="system">Device</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
    </div>
  </div>
  <p class="note">“Device” follows your system setting and updates automatically when it changes.</p>
</div>

<div class="card glass" id="card">
  <div class="card-head">
    <span class="label">Pin location</span>
    <span class="chip" id="accChip">GPS ± —</span>
  </div>

  <div class="coords">
    <div class="coord"><small>LATITUDE</small><span class="empty" id="latVal">—</span></div>
    <div class="coord"><small>LONGITUDE</small><span class="empty" id="lonVal">—</span></div>
  </div>

  <div class="addr" id="myCard">
    <div class="addr-body"><small>Address</small><p class="empty" id="myAddr">Tap the map or mark your location</p></div>
    <button class="copy" data-copy="myAddr" aria-label="Copy address"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></button>
  </div>
  <div class="addr opp" id="oppCard">
    <div class="addr-body"><small>Opposite side of road</small><p class="empty" id="oppAddr">Calculated once a pin is placed</p></div>
    <button class="copy" data-copy="oppAddr" aria-label="Copy address"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></button>
  </div>

  <button class="btn-primary" id="btnLocate">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
    <span class="spin"></span>
    <span>Mark my location</span>
  </button>
  <div class="row">
    <button class="btn-sec" id="btnRecenter">Recenter</button>
    <button class="btn-sec" id="btnClear">Clear</button>
  </div>
  <div class="help" id="help"></div>
</div>

<div class="toast glass" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $ = id => document.getElementById(id);
const PROTOMAPS_KEY = 'e0590e11b7479b37';
// Protomaps keys are domain-locked. If the key is rejected (e.g. on 127.0.0.1:5500),
// the map automatically falls back to CARTO's free light/dark styles so it still works.
let provider = 'protomaps';
const styleUrl = t => provider === 'protomaps'
  ? `https://api.protomaps.com/styles/v5/${t}/en.json?key=${PROTOMAPS_KEY}`
  : `https://basemaps.cartocdn.com/gl/${t === 'dark' ? 'dark-matter' : 'positron'}-gl-style/style.json`;

/* ───────── Theme: site + map, each Device / Light / Dark ───────── */
const mq = matchMedia('(prefers-color-scheme: dark)');
let prefs = { site: 'system', map: 'system' };
try { Object.assign(prefs, JSON.parse(localStorage.getItem('locator-prefs') || '{}')); } catch {}
const resolve = p => p === 'system' ? (mq.matches ? 'dark' : 'light') : p;

function applySite() {
  const t = resolve(prefs.site);
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=color-scheme]').content = t;
}
let mapTheme = resolve(prefs.map);
function applyMap() {
  const t = resolve(prefs.map);
  if (typeof map !== 'undefined' && t !== mapTheme) { mapTheme = t; map.setStyle(styleUrl(t)); }
}
function refreshSegs() {
  document.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.key, btns = [...seg.querySelectorAll('button')];
    const idx = btns.findIndex(b => b.dataset.v === prefs[key]);
    seg.style.setProperty('--i', Math.max(idx, 0));
    btns.forEach((b, i) => b.classList.toggle('active', i === idx));
  });
  const nice = k => prefs[k] === 'system' ? `(${mq.matches ? 'dark' : 'light'} now)` : '';
  $('siteNote').textContent = nice('site');
  $('mapNote').textContent = nice('map');
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  prefs[b.closest('.seg').dataset.key] = b.dataset.v;
  try { localStorage.setItem('locator-prefs', JSON.stringify(prefs)); } catch {}
  applySite(); applyMap(); refreshSegs();
}));
mq.addEventListener('change', () => { applySite(); applyMap(); refreshSegs(); });
applySite(); refreshSegs();

/* settings popover */
function setSettings(open) {
  $('settings').classList.toggle('open', open);
  $('scrim').classList.toggle('open', open);
  $('gear').classList.toggle('open', open);
}
$('gear').onclick = () => setSettings(!$('settings').classList.contains('open'));
$('scrim').onclick = () => setSettings(false);

/* ───────── Map ───────── */
const map = new maplibregl.Map({
  container: 'map',
  style: styleUrl(mapTheme),
  center: [-78.8, 43.0], zoom: 12,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.on('error', e => {
  if (provider === 'protomaps' && !e.sourceId && !map.isStyleLoaded()) {
    provider = 'carto';
    map.setStyle(styleUrl(mapTheme));
    console.warn('Protomaps style blocked for this origin — using CARTO fallback. Add this origin to your Protomaps key to use Protomaps locally.');
  }
});

new ResizeObserver(() => {
  document.documentElement.style.setProperty('--card-h', ($('card').offsetHeight + 10) + 'px');
}).observe($('card'));

/* ───────── Toast ───────── */
let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ───────── Geocoding (throttled to Nominatim's 1 req/sec, stale-safe) ───────── */
let lookupId = 0, chain = Promise.resolve(), lastReq = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function nominatim(url, token) {
  const p = chain.then(async () => {
    if (token !== lookupId) return null;
    const wait = Math.max(0, 1050 - (Date.now() - lastReq));
    if (wait) await sleep(wait);
    if (token !== lookupId) return null;
    lastReq = Date.now();
    const r = await fetch(url);
    return r.json();
  });
  chain = p.catch(() => {});
  return p.catch(() => null);
}
async function reverse(lat, lng, token) {
  const d = await nominatim(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1&accept-language=en`, token);
  if (!d || !d.address) return null;
  const a = d.address;
  const num = a.house_number || '';
  const road = a.road || a.pedestrian || a.footway || '';
  const city = a.city || a.town || a.village || a.municipality || '';
  const tail = (city ? ', ' + city : '') + (a.state ? ', ' + a.state : '') + (a.postcode ? ' ' + a.postcode : '');
  let text;
  if (road) text = (num ? num + ' ' : '') + road + tail;
  else text = (d.display_name || '').split(',').slice(0, 4).join(',').trim();
  // lat/lon = where the matched building actually sits (used to decide which side of the road it's on)
  return text ? { text, road, num, tail, lat: parseFloat(d.lat), lon: parseFloat(d.lon) } : null;
}

function setAddr(id, cardId, text, live) {
  const el = $(id), card = $(cardId);
  el.className = text ? '' : 'empty';
  el.textContent = text || 'Address not found';
  card.classList.toggle('live', !!text && live);
  if (text) el.classList.add('tick');
}
function setLoading(id, cardId) {
  const el = $(id); el.className = 'loading'; el.textContent = '·'; $(cardId).classList.remove('live');
}

/* ── Opposite side of road ──
   1. Pull the real road geometry + every numbered address nearby from OpenStreetMap (Overpass).
   2. Work out which side of the road the pin's building is on (cross product vs. nearest road segment).
   3. Pick the closest address on the SAME street that is on the OTHER side.
   4. If OSM has no address data over there, probe straight across the road with a reverse lookup. */
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
async function overpass(lat, lon, token) {
  const q = `[out:json][timeout:20];
way(around:70,${lat},${lon})["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$"]["name"];
out geom;
way(around:120,${lat},${lon})["building"];
out geom;
nwr(around:110,${lat},${lon})["addr:housenumber"]["addr:street"];
out center;`;
  for (const url of OVERPASS) {
    if (token !== lookupId) return null;
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(q) });
      if (!r.ok) continue;
      return (await r.json()).elements || [];
    } catch {}
  }
  return null;
}

// nearest point on any road polyline (planar meters) + which side of it `pt` is on
function nearestSeg(pt, lines) {
  let best = null;
  for (const line of lines) for (let i = 0; i < line.length - 1; i++) {
    const a = line[i], b = line[i + 1];
    const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy || 1e-9;
    const t = Math.max(0, Math.min(1, ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / l2));
    const cx = a[0] + t * dx, cy = a[1] + t * dy, dist = Math.hypot(pt[0] - cx, pt[1] - cy);
    if (!best || dist < best.dist) best = { dist, dx, dy, cx, cy, len: Math.sqrt(l2), side: Math.sign(dx * (pt[1] - a[1]) - dy * (pt[0] - a[0])) };
  }
  return best;
}

async function findOpposite(lat, lng, base, token) {
  const fail = msg => { setAddr('oppAddr', 'oppCard', null); $('oppAddr').textContent = msg; };
  if (!base || !base.road) return fail('No road found for this pin');

  const hLat = isNaN(base.lat) ? lat : base.lat, hLon = isNaN(base.lon) ? lng : base.lon;
  const kx = 111320 * Math.cos(hLat * Math.PI / 180), ky = 111320;
  const xy = (la, lo) => [(lo - hLon) * kx, (la - hLat) * ky];
  const norm = s => (s || '').toLowerCase().trim();

  const els = await overpass(hLat, hLon, token);
  if (token !== lookupId) return;
  if (!els) return fail('Road data unavailable — try again');

  // outline the pin's actual building in red
  setProp('pin', buildingAt(els, hLat, hLon, kx, ky));
  const markOpp = (la, lo) => setProp('opp', buildingAt(els, la, lo, kx, ky));

  let roads = els.filter(e => e.type === 'way' && e.geometry && e.tags && e.tags.highway);
  const same = roads.filter(r => norm(r.tags.name) === norm(base.road));
  if (same.length) roads = same;
  if (!roads.length) return fail('Road geometry not found');

  const lines = roads.map(r => r.geometry.map(g => xy(g.lat, g.lon)));
  const hs = nearestSeg([0, 0], lines);
  const baseSide = hs.side || 1;
  const bn = parseInt(base.num);

  let best = null;
  for (const e of els) {
    const t = e.tags;
    if (!t || t.highway || !t['addr:housenumber'] || norm(t['addr:street']) !== norm(base.road)) continue;
    const la = e.lat != null ? e.lat : e.center && e.center.lat;
    const lo = e.lon != null ? e.lon : e.center && e.center.lon;
    if (la == null || lo == null) continue;
    const p = xy(la, lo), dist = Math.hypot(p[0], p[1]);
    if (dist < 4) continue;                              // that's the pin's own building
    const seg = nearestSeg(p, lines);
    if (!seg || seg.side === 0 || seg.side === baseSide) continue;   // same side → skip
    const an = parseInt(t['addr:housenumber']);
    const score = dist + (!isNaN(bn) && !isNaN(an) && bn % 2 === an % 2 ? 12 : 0); // across the road usually flips odd/even
    if (!best || score < best.score) best = { score, num: t['addr:housenumber'], street: t['addr:street'], la, lo };
  }
  if (best) { setAddr('oppAddr', 'oppCard', `${best.num} ${best.street}${base.tail}`, true); markOpp(best.la, best.lo); return; }

  // Fallback: no mapped addresses across the road — probe straight across it
  const left = [-hs.dy / hs.len, hs.dx / hs.len];
  const dir = [-left[0] * baseSide, -left[1] * baseSide];
  let weak = null;
  for (const d of [Math.max(hs.dist, 25), Math.max(hs.dist, 25) + 18]) {
    const px = hs.cx + dir[0] * d, py = hs.cy + dir[1] * d;
    const a = await reverse(hLat + py / ky, hLon + px / kx, token);
    if (token !== lookupId) return;
    if (!a || a.text === base.text) continue;
    if (a.road === base.road) { setAddr('oppAddr', 'oppCard', a.text, true); markOpp(a.lat, a.lon); return; }
    if (!weak) weak = a;
  }
  if (weak) { setAddr('oppAddr', 'oppCard', weak.text, true); markOpp(weak.lat, weak.lon); }
  else fail('No address found across the road');
}

async function lookup(lat, lng) {
  const token = ++lookupId;
  clearProps();
  setLoading('myAddr', 'myCard'); setLoading('oppAddr', 'oppCard');
  const base = await reverse(lat, lng, token);
  if (token !== lookupId) return;
  setAddr('myAddr', 'myCard', base && base.text, true);
  await findOpposite(lat, lng, base, token);
}

/* ───────── Property highlight (red = pin's property, amber = opposite side) ───────── */
const EMPTY_FC = { type: 'FeatureCollection', features: [] };
const propGeo = { pin: EMPTY_FC, opp: EMPTY_FC };
const PROP_COLOR = { pin: '#ff3b30', opp: '#ff9f0a' };

function ensurePropLayers() {           // re-run after every style change (light/dark switch wipes layers)
  for (const k of ['pin', 'opp']) {
    const id = 'prop-' + k;
    if (!map.getSource(id)) map.addSource(id, { type: 'geojson', data: propGeo[k] });
    if (!map.getLayer(id + '-fill')) map.addLayer({ id: id + '-fill', type: 'fill', source: id, paint: { 'fill-color': PROP_COLOR[k], 'fill-opacity': 0.38 } });
    if (!map.getLayer(id + '-line')) map.addLayer({ id: id + '-line', type: 'line', source: id, paint: { 'line-color': PROP_COLOR[k], 'line-width': 2.5 } });
  }
}
map.on('style.load', ensurePropLayers);

function setProp(k, ring) {
  propGeo[k] = ring
    ? { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [ring] } }] }
    : EMPTY_FC;
  const s = map.getSource('prop-' + k);
  if (s) s.setData(propGeo[k]);
}
function clearProps() { setProp('pin', null); setProp('opp', null); }
function pointInRing(pt, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// building footprint containing the point (or the nearest one within ~15 m)
function buildingAt(els, la, lo, kx, ky) {
  let near = null;
  for (const e of els) {
    if (e.type !== 'way' || !e.geometry || !e.tags || !e.tags.building) continue;
    const ring = e.geometry.map(g => [g.lon, g.lat]);
    if (ring.length < 4) continue;
    if (pointInRing([lo, la], ring)) return ring;
    const cx = ring.reduce((s, p) => s + p[0], 0) / ring.length, cy = ring.reduce((s, p) => s + p[1], 0) / ring.length;
    const d = Math.hypot((cx - lo) * kx, (cy - la) * ky);
    if (d < 15 && (!near || d < near.d)) near = { d, ring };
  }
  return near ? near.ring : null;
}

/* ───────── UI state ───────── */
function showCoords(lat, lng, acc) {
  [['latVal', lat], ['lonVal', lng]].forEach(([id, v]) => {
    const el = $(id); el.textContent = v.toFixed(6); el.className = 'tick';
  });
  if (acc != null) { $('accChip').textContent = `GPS ± ${Math.round(acc)} m`; $('accChip').classList.add('live'); }
}

let pin = null, gpsDot = null;

function makePinEl() {
  const el = document.createElement('div');
  el.innerHTML = `<div class="pin"><svg viewBox="0 0 36 46"><path class="p-fill" d="M18 0C8.06 0 0 8.06 0 18c0 12.6 18 28 18 28s18-15.4 18-28C36 8.06 27.94 0 18 0z"/><circle cx="18" cy="18" r="6.5" fill="#fff"/></svg></div>`;
  el.addEventListener('click', e => e.stopPropagation());
  return el;
}

function placePin(lat, lng, acc) {
  showCoords(lat, lng, acc);
  if (pin) pin.setLngLat([lng, lat]);
  else {
    pin = new maplibregl.Marker({ element: makePinEl(), draggable: true, anchor: 'bottom' }).setLngLat([lng, lat]).addTo(map);
    pin.on('drag', () => { const p = pin.getLngLat(); showCoords(p.lat, p.lng, null); });
    pin.on('dragend', () => { const p = pin.getLngLat(); $('accChip').textContent = 'Manual pin'; $('accChip').classList.remove('live'); lookup(p.lat, p.lng); toast('Pin moved'); });
  }
  lookup(lat, lng);
}

function setGps(on) {
  $('gpsState').classList.toggle('on', on);
  $('gpsLabel').textContent = on ? 'GPS active' : 'No fix';
}

function showHelp(html, info) {
  const h = $('help'); h.innerHTML = html; h.classList.toggle('info', !!info); h.classList.add('show');
}
const hideHelp = () => $('help').classList.remove('show');

/* ───────── Geolocation (high accuracy first, then fallback to network location) ───────── */
const getPos = o => new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, o));

async function locateMe() {
  hideHelp();
  if (!window.isSecureContext) {
    showHelp('<b>Location needs a secure page.</b> Open this from <b>https://</b> or <b>http://localhost</b> — not a file:// path or a LAN IP.');
    return;
  }
  if (!navigator.geolocation) { showHelp('This browser doesn’t support location.'); return; }

  const btn = $('btnLocate'); btn.classList.add('loading');
  let pos;
  try {
    try {
      pos = await getPos({ enableHighAccuracy: true, timeout: 7000, maximumAge: 0 });
    } catch (e) {
      if (e.code === 1) throw e;
      // Desktops without a GPS chip often fail high-accuracy mode — retry with Wi-Fi/network location
      pos = await getPos({ enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
    }
  } catch (e) {
    btn.classList.remove('loading');
    if (e.code === 1) {
      showHelp('<b>Permission denied.</b> Allow location for this site in your browser’s address-bar menu, then try again.');
    } else {
      showHelp('<b>Your Mac couldn’t get a position.</b> Check <b>System Settings → Privacy & Security → Location Services</b>: turn it on and enable it for your browser (Chrome / Safari / Arc). Also make sure Wi-Fi is on — Macs have no GPS chip and locate through Wi-Fi. You can still tap the map to drop a pin manually.');
    }
    toast('Couldn’t get location');
    return;
  }
  btn.classList.remove('loading');

  const { latitude: lat, longitude: lng, accuracy: acc } = pos.coords;
  if (gpsDot) gpsDot.setLngLat([lng, lat]);
  else {
    const el = document.createElement('div'); el.className = 'dot';
    gpsDot = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
  }
  setGps(true);
  map.flyTo({ center: [lng, lat], zoom: 17.5, speed: 1.2, essential: true });
  placePin(lat, lng, acc);
  toast('Position locked — drag the pin to adjust');
}

/* ───────── Wiring ───────── */
$('btnLocate').addEventListener('click', e => {
  const b = e.currentTarget, r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2;
  const rip = document.createElement('span'); rip.className = 'ripple';
  rip.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.appendChild(rip); setTimeout(() => rip.remove(), 650);
  locateMe();
});

$('btnRecenter').onclick = () => {
  const t = pin || gpsDot;
  if (!t) return toast('No position yet');
  map.flyTo({ center: t.getLngLat(), zoom: Math.max(map.getZoom(), 16), essential: true });
};

$('btnClear').onclick = () => {
  lookupId++;
  clearProps();
  if (pin) { pin.remove(); pin = null; }
  if (gpsDot) { gpsDot.remove(); gpsDot = null; }
  ['latVal', 'lonVal'].forEach(id => { $(id).textContent = '—'; $(id).className = 'empty'; });
  $('accChip').textContent = 'GPS ± —'; $('accChip').classList.remove('live');
  $('myAddr').className = 'empty'; $('myAddr').textContent = 'Tap the map or mark your location';
  $('oppAddr').className = 'empty'; $('oppAddr').textContent = 'Calculated once a pin is placed';
  $('myCard').classList.remove('live'); $('oppCard').classList.remove('live');
  setGps(false); hideHelp(); toast('Cleared');
};

map.on('click', e => {
  if (e.originalEvent.target.closest('.maplibregl-ctrl')) return;
  $('accChip').textContent = 'Manual pin'; $('accChip').classList.remove('live');
  placePin(e.lngLat.lat, e.lngLat.lng, null);
});

document.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', () => {
  const text = $(btn.dataset.copy).textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('done'); toast('Copied to clipboard');
    setTimeout(() => btn.classList.remove('done'), 1600);
  }).catch(() => toast('Copy failed'));
}));

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') setSettings(false);
  if (e.key.toLowerCase() === 'l' && !e.metaKey && !e.ctrlKey) locateMe();
});
</script>
</body>
</html>
